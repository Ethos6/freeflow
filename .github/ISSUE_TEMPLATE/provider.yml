name: Provider request
description: Ask for a new provider or a fix to an existing one
labels: [provider]
body:
  - type: input
    id: name
    attributes:
      label: Provider
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Link to its OpenAI-compatible (or Anthropic-compatible) API docs
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything special?
      description: Free tier, key format, required headers, regional endpoints, terms that limit use.
