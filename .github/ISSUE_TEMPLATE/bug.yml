name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
      placeholder: groq/llama-3.3-70b-versatile
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: Claude Code 2.1.304
  - type: textarea
    id: log
    attributes:
      label: freeflow output
      description: The lines freeflow printed (or ~/.freeflow/server.log). Remove any keys first.
      render: text
  - type: input
    id: version
    attributes:
      label: freeflow version and OS
      placeholder: 1.0.0 on macOS 15
